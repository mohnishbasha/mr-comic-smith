name: ci

on:
  push:
    branches: [develop, staging, main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"  # nightly-cloud
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"
  PY_EXTRAS: --all-extras
  NODE_VERSION: "22"
  TS_PACKAGES: web/studio reader integrations/pi

jobs:
  lint-and-typecheck:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: uv sync --frozen ${{ env.PY_EXTRAS }}
        shell: bash
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_em_dash.py
      - run: uv run python scripts/sync-test-plan.py --check
      - run: uv run lint-imports
      - run: uv run mypy
      - name: TypeScript lint and typecheck
        shell: bash
        run: |
          for p in $TS_PACKAGES; do
            if [ -f "$p/package-lock.json" ]; then
              (cd "$p" && npm ci && npm run --if-present lint && npm run --if-present typecheck)
            fi
          done
      - name: Generated API types are current
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -x scripts/gen-api-types.sh ]; then
            ./scripts/gen-api-types.sh && git diff --exit-code web/studio/src/api/
          fi

  unit-tests:
    if: github.event_name != 'schedule'
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: uv sync --frozen ${{ env.PY_EXTRAS }}
        shell: bash
      - run: uv run pytest
      - name: TypeScript unit tests
        if: matrix.python == '3.12'
        shell: bash
        run: |
          for p in $TS_PACKAGES; do
            if [ -f "$p/package-lock.json" ]; then (cd "$p" && npm ci && npm run --if-present test); fi
          done

  coverage:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: uv sync --frozen ${{ env.PY_EXTRAS }}
      - run: uv run pytest --cov --cov-report=term --cov-report=json:coverage.json --cov-report=xml
      - run: uv run python scripts/check-coverage.py coverage.json .coverage-thresholds.toml
      - name: TypeScript coverage
        run: |
          for p in $TS_PACKAGES; do
            if [ -f "$p/package-lock.json" ]; then (cd "$p" && npm ci && npm run --if-present coverage); fi
          done
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  smoke:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen ${{ env.PY_EXTRAS }}
      - run: bash tests/smoke/smoke.sh

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      OLLAMA_HOST: http://127.0.0.1:11434
      COMIC_SMITH_IT_OLLAMA_MODEL: qwen3:0.6b
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen ${{ env.PY_EXTRAS }}
      - run: uv run playwright install --with-deps chromium
      - name: Install Ollama and a tiny model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS $OLLAMA_HOST/api/tags && break; sleep 2; done
          ollama pull qwen3:0.6b
      - name: Integration tests (exit 5 means none collected yet)
        run: uv run pytest -m integration -o addopts="-ra --strict-markers" || [ $? -eq 5 ]

  visual-regression:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen ${{ env.PY_EXTRAS }}
      - run: uv run playwright install --with-deps chromium
      - name: Visual goldens (exit 5 means none collected yet)
        run: uv run pytest tests/visual -o addopts="-ra --strict-markers" || [ $? -eq 5 ]
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/__diff__/

  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: uv sync --frozen ${{ env.PY_EXTRAS }}
      - run: make studio-build
      - name: Playwright
        run: |
          for p in reader; do
            if [ -f "$p/package-lock.json" ]; then (cd "$p" && npm ci && npm run build); fi
          done
          cd tests/e2e && npm ci && npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/

  check-versions:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-versions.sh

  security:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: uv sync --frozen ${{ env.PY_EXTRAS }}
      - name: pip-audit on the runtime closure
        run: |
          uv export --frozen --no-dev --all-extras --no-emit-project --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
      - name: npm audit
        run: |
          for p in $TS_PACKAGES tests/e2e; do
            if [ -f "$p/package-lock.json" ]; then (cd "$p" && npm audit --audit-level=high --omit=dev); fi
          done
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gpu-integration:
    # Self-hosted runner labeled `gpu`; enabled with the repository variable GPU_RUNNER_ENABLED so PRs
    # never wait on a runner that does not exist. Runs on PRs to staging/main and on dispatch.
    if: vars.GPU_RUNNER_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.base_ref == 'staging' || github.base_ref == 'main')
    runs-on: [self-hosted, gpu]
    env:
      COMIC_SMITH_COMFYUI_URL: ${{ vars.COMIC_SMITH_COMFYUI_URL || 'http://127.0.0.1:8188' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen ${{ env.PY_EXTRAS }}
      - run: uv run pytest -m gpu -o addopts="-ra --strict-markers" || [ $? -eq 5 ]

  nightly-cloud:
    # Live Gemini and OpenAI contract tests with secrets; schedule and dispatch only, never on PRs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen ${{ env.PY_EXTRAS }}
      - run: uv run pytest -m cloud -o addopts="-ra --strict-markers" || [ $? -eq 5 ]

  harness-smoke-tests:
    # Staging and release only (Appendix J): MCP stdio handshake and Pi extension unit tests.
    if: github.base_ref == 'staging' || github.base_ref == 'main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_call'
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: uv sync --frozen ${{ env.PY_EXTRAS }}
      - name: MCP handshake
        run: |
          if [ -d tests/integration/harness ]; then
            uv run pytest -m integration -o addopts="-ra --strict-markers" tests/integration/harness
          else
            echo "no harness tests yet"
          fi
      - name: Pi extension unit tests
        run: |
          if [ -f integrations/pi/package-lock.json ]; then (cd integrations/pi && npm ci && npm test); fi
