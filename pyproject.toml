[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mr-comic-smith"
version = "0.0.1"
description = "Turn a story idea or a photo into a growing comic strip, with AI plot suggestions at every step, then stitch it into pages and a book you can export as PNG, PDF, or a web page."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Serverless Ventures LLC" }]
requires-python = ">=3.12,<3.14"
keywords = ["comics", "comic-generator", "storytelling", "image-generation", "character-consistency", "comfyui", "local-first", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "httpx>=0.27",
  "websockets>=12.0",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "numpy>=1.26",
  "fonttools>=4.53",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "keyring>=25.0",
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "playwright>=1.47",
  "pikepdf>=9.0",
]

[project.optional-dependencies]
comfyui = []  # HTTP and websocket client only; ComfyUI runs as a separate service
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
ocr = ["rapidocr-onnxruntime>=1.3"]
server = []  # FastAPI and uvicorn are base dependencies because the Studio needs them
mcp = ["mcp>=1.2"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "respx>=0.21",
  "syrupy>=4.6",
  "scikit-image>=0.24",
  "pypdf>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pip-audit>=2.7",
  "pip-licenses>=5.0",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "types-PyYAML",
  "types-jsonschema",
  "import-linter>=2.1",
  "codespell>=2.3",
]

[project.scripts]
mr-comic-smith = "comic_smith.cli:main"

[project.urls]
Homepage = "https://getcomicsmith.com"
Repository = "https://github.com/mohnishbasha/mr-comic-smith"
Issues = "https://github.com/mohnishbasha/mr-comic-smith/issues"
Changelog = "https://github.com/mohnishbasha/mr-comic-smith/blob/develop/CHANGELOG.md"

[tool.hatch.build]
# The built Studio bundle is gitignored but must ship in the wheel (make studio-build).
artifacts = ["comic_smith/server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["comic_smith"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "comic_smith/_schemas"

[tool.hatch.build.targets.sdist]
include = ["comic_smith", "schemas", "README.md", "LICENSE", "THIRD_PARTY_LICENSES.md", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["comic_smith/server/static", "node_modules", "*.md", "comic_smith/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "PTH", "TID", "PL", "TD"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "TD003", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "C408", "S101", "S105", "S106", "S108", "PLR0915", "PLC0415", "S310", "S603", "S607", "PLR2004"]
"scripts/**" = ["S603", "S607", "T201", "N999"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["comic_smith"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pillow_heif.*", "keyring.*", "rapidocr_onnxruntime.*", "pikepdf.*", "fontTools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not gpu and not cloud'"
markers = [
  "integration: needs Chromium, Ollama, a stub ComfyUI server, or real worker processes",
  "gpu: needs an NVIDIA GPU and a running ComfyUI with workflow models",
  "cloud: live Gemini or OpenAI calls with secrets (nightly only)",
  "slow: takes more than a few seconds",
  "flaky_quarantine: quarantined flaky test with a linked issue",
]
timeout = 120
python_functions = ["test_*", "it_*", "smoke_*", "e2e_*", "regression_*", "vis_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["comic_smith"]
branch = true
omit = ["comic_smith/server/static/*", "comic_smith/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.importlinter]
root_package = "comic_smith"

[[tool.importlinter.contracts]]
name = "Front doors use the public API only"
type = "forbidden"
source_modules = ["comic_smith.cli", "comic_smith.server", "comic_smith.mcp_server"]
forbidden_modules = ["comic_smith.db", "comic_smith.backends"]
allow_indirect_imports = true

[tool.codespell]
skip = "*.lock,*.svg,node_modules,tests/fixtures,*.json,dist,docs/BUILD_PROMPT.md,package-lock.json"
ignore-words-list = "te,ot,nd,ba"
